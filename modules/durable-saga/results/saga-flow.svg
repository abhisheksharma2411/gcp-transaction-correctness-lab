<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1510 492" width="1510" height="492" role="img"><title>Orchestrated saga: six steps across five services, with the compensation chain beneath</title><desc>Six step boxes in a row, numbered one to six: reserve_stock at inventory; authorize_payment at payments; book_shipment at fulfilment; capture_payment at payments; post_ledger_entry at ledger; send_confirmation at notifications. Arrows run left to right between them. A dashed vertical line before capture_payment marks the pivot, labelled "no way back from here". Below the first 3 steps sit their compensation boxes — release_stock, void_authorization, cancel_shipment — joined to their steps by dashed vertical arrows and chained right to left, ending at a label reading COMPENSATED. To the right of the compensation row, two lines of red text read "a step before the pivot is refused, or never answers", and an arrow runs from under them leftwards into the first compensation box. A band under the last three steps reads "After the pivot there is nothing to go back to: these steps are retried, and then handed to an operator."</desc><defs><marker id="arrow-41586e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#41586e"/></marker><marker id="arrow-b3453a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b3453a"/></marker><marker id="arrow-2f6b4f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2f6b4f"/></marker></defs><rect width="1510" height="492" fill="#ffffff"/><text x="48" y="44" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#1b2f42">One saga, six steps, five services</text><text x="48" y="70" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#4d708c">Generated from src/saga.ts. Forward commands run left to right; compensations run right to left and stop at the pivot.</text><rect x="176" y="112" width="176" height="88" rx="7" fill="#f7f9fb" stroke="#41586e" stroke-width="1.3"/><text x="188" y="136" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#4d708c">inventory</text><text x="188" y="157" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1b2f42">reserve_stock</text><text x="188" y="180" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#4d708c">compensable</text><text x="340" y="136" text-anchor="end" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#4d708c">1</text><rect x="398" y="112" width="176" height="88" rx="7" fill="#f7f9fb" stroke="#41586e" stroke-width="1.3"/><text x="410" y="136" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#4d708c">payments</text><text x="410" y="157" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1b2f42">authorize_payment</text><text x="410" y="180" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#4d708c">compensable</text><text x="562" y="136" text-anchor="end" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#4d708c">2</text><rect x="620" y="112" width="176" height="88" rx="7" fill="#f7f9fb" stroke="#41586e" stroke-width="1.3"/><text x="632" y="136" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#4d708c">fulfilment</text><text x="632" y="157" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1b2f42">book_shipment</text><text x="632" y="180" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#4d708c">answers later</text><text x="784" y="136" text-anchor="end" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#4d708c">3</text><rect x="842" y="112" width="176" height="88" rx="7" fill="#eef6f1" stroke="#2f6b4f" stroke-width="2.4"/><text x="854" y="136" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#4d708c">payments</text><text x="854" y="157" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1b2f42">capture_payment</text><text x="854" y="180" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#2f6b4f">PIVOT</text><text x="1006" y="136" text-anchor="end" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#4d708c">4</text><rect x="1064" y="112" width="176" height="88" rx="7" fill="#eef6f1" stroke="#2f6b4f" stroke-width="1.3"/><text x="1076" y="136" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#4d708c">ledger</text><text x="1076" y="157" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1b2f42">post_ledger_entry</text><text x="1076" y="180" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#4d708c">retry forward</text><text x="1228" y="136" text-anchor="end" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#4d708c">5</text><rect x="1286" y="112" width="176" height="88" rx="7" fill="#eef6f1" stroke="#2f6b4f" stroke-width="1.3"/><text x="1298" y="136" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#4d708c">notifications</text><text x="1298" y="157" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1b2f42">send_confirmation</text><text x="1298" y="180" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#8a6212">irreversible</text><text x="1450" y="136" text-anchor="end" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#4d708c">6</text><path d="M 352 156 L 394 156" fill="none" stroke="#41586e" stroke-width="1.8" marker-end="url(#arrow-41586e)"/><path d="M 574 156 L 616 156" fill="none" stroke="#41586e" stroke-width="1.8" marker-end="url(#arrow-41586e)"/><path d="M 796 156 L 838 156" fill="none" stroke="#41586e" stroke-width="1.8" marker-end="url(#arrow-41586e)"/><path d="M 1018 156 L 1060 156" fill="none" stroke="#41586e" stroke-width="1.8" marker-end="url(#arrow-41586e)"/><path d="M 1240 156 L 1282 156" fill="none" stroke="#41586e" stroke-width="1.8" marker-end="url(#arrow-41586e)"/><path d="M 819 86 L 819 358" stroke="#2f6b4f" stroke-width="1.6" stroke-dasharray="6 5"/><text x="827" y="80" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2f6b4f">no way back from here</text><rect x="176" y="258" width="176" height="74" rx="7" fill="#fdf4f2" stroke="#b3453a" stroke-width="1.3"/><text x="188" y="280" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#8f342b">compensation</text><text x="188" y="301" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1b2f42">release_stock</text><text x="188" y="320" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#4d708c">returns the units to stock</text><path d="M 264 200 L 264 254" fill="none" stroke="#b3453a" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#arrow-b3453a)"/><rect x="398" y="258" width="176" height="74" rx="7" fill="#fdf4f2" stroke="#b3453a" stroke-width="1.3"/><text x="410" y="280" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#8f342b">compensation</text><text x="410" y="301" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1b2f42">void_authorization</text><text x="410" y="320" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#4d708c">releases the hold</text><path d="M 486 200 L 486 254" fill="none" stroke="#b3453a" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#arrow-b3453a)"/><rect x="620" y="258" width="176" height="74" rx="7" fill="#fdf4f2" stroke="#b3453a" stroke-width="1.3"/><text x="632" y="280" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#8f342b">compensation</text><text x="632" y="301" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1b2f42">cancel_shipment</text><text x="632" y="320" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#4d708c">cancels the booking</text><path d="M 708 200 L 708 254" fill="none" stroke="#b3453a" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#arrow-b3453a)"/><path d="M 620 307 L 578 307" fill="none" stroke="#b3453a" stroke-width="1.8" marker-end="url(#arrow-b3453a)"/><path d="M 398 307 L 356 307" fill="none" stroke="#b3453a" stroke-width="1.8" marker-end="url(#arrow-b3453a)"/><text x="848" y="284" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#8f342b">a step before the pivot is refused,</text><text x="848" y="302" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#8f342b">or never answers</text><path d="M 970 307 L 800 307" fill="none" stroke="#b3453a" stroke-width="1.8" marker-end="url(#arrow-b3453a)"/><path d="M 176 307 L 58 307" fill="none" stroke="#b3453a" stroke-width="1.8" marker-end="url(#arrow-b3453a)"/><text x="50" y="293" text-anchor="start" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#8f342b">COMPENSATED</text><text x="50" y="333" text-anchor="start" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#4d708c">nothing is left live</text><rect x="842" y="358" width="620" height="46" rx="6" fill="#eef6f1" stroke="#2f6b4f" stroke-width="1.1"/><text x="856" y="386" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1b2f42">After the pivot there is nothing to go back to: these steps are retried, and then handed to an operator.</text><text x="48" y="474" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#4d708c">Every box and every arrow is a row in the definition. The generator refuses to emit a drawing in which an arrow crosses a box.</text></svg>
