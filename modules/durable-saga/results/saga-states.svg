<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1134 686" width="1134" height="686" role="img"><title>The saga execution state machine, including compensation failure and manual repair</title><desc>Eight boxes. RUNNING, PIVOTED, COMPLETED, COMPENSATING, COMPENSATED, COMPENSATION_FAILED, MANUAL_REPAIR, CLOSED_MANUALLY. RUNNING to COMPENSATING on step_failed; RUNNING to COMPENSATING on cancel_requested; RUNNING to PIVOTED on pivot_committed; PIVOTED to COMPLETED on forward_complete; PIVOTED to MANUAL_REPAIR on forward_exhausted; COMPENSATING to COMPENSATED on compensations_complete; COMPENSATING to COMPENSATION_FAILED on compensation_exhausted; COMPENSATION_FAILED to COMPENSATING on operator_retried; COMPENSATION_FAILED to CLOSED_MANUALLY on operator_closed; MANUAL_REPAIR to PIVOTED on operator_resumed; MANUAL_REPAIR to CLOSED_MANUALLY on operator_closed. COMPENSATION_FAILED and MANUAL_REPAIR are shaded amber and labelled "owned by payments operations"; they are left only by an operator. COMPLETED, COMPENSATED and CLOSED_MANUALLY are terminal and have no outgoing arrow.</desc><defs><marker id="arrow-41586e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#41586e"/></marker><marker id="arrow-b3453a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b3453a"/></marker><marker id="arrow-2f6b4f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2f6b4f"/></marker><marker id="arrow-8a6212" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8a6212"/></marker></defs><rect width="1134" height="686" fill="#ffffff"/><text x="54" y="44" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#1b2f42">Where a saga execution can be</text><text x="54" y="70" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#4d708c">Eight states and eleven transitions, generated from src/saga.ts. Two states are left only by a person, and both name who.</text><rect x="54" y="168" width="186" height="58" rx="7" fill="#f7f9fb" stroke="#41586e" stroke-width="1.3"/><text x="147" y="203" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1b2f42">RUNNING</text><rect x="334" y="168" width="186" height="58" rx="7" fill="#f7f9fb" stroke="#41586e" stroke-width="1.3"/><text x="427" y="203" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1b2f42">PIVOTED</text><rect x="894" y="168" width="186" height="58" rx="7" fill="#eef6f1" stroke="#2f6b4f" stroke-width="2.2"/><text x="987" y="203" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1b2f42">COMPLETED</text><rect x="334" y="392" width="186" height="58" rx="7" fill="#fdf4f2" stroke="#b3453a" stroke-width="1.3"/><text x="427" y="427" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1b2f42">COMPENSATING</text><rect x="894" y="392" width="186" height="58" rx="7" fill="#f7f9fb" stroke="#41586e" stroke-width="2.2"/><text x="987" y="427" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1b2f42">COMPENSATED</text><rect x="614" y="504" width="186" height="58" rx="7" fill="#fdf6e6" stroke="#8a6212" stroke-width="1.3"/><text x="707" y="532" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1b2f42">COMPENSATION_FAILED</text><text x="707" y="550" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#8a6212">owned by payments operations</text><rect x="614" y="280" width="186" height="58" rx="7" fill="#fdf6e6" stroke="#8a6212" stroke-width="1.3"/><text x="707" y="308" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1b2f42">MANUAL_REPAIR</text><text x="707" y="326" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#8a6212">owned by payments operations</text><rect x="894" y="504" width="186" height="58" rx="7" fill="#f7f9fb" stroke="#41586e" stroke-width="2.2"/><text x="987" y="539" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1b2f42">CLOSED_MANUALLY</text><path d="M 240 197 L 287 197 L 287 421 L 330 421" fill="none" stroke="#b3453a" stroke-width="1.8" marker-end="url(#arrow-b3453a)"/><rect x="208.7" y="348.28" width="77.3" height="18" rx="3" fill="#ffffff" opacity="0.94"/><text x="280" y="361.28" text-anchor="end" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#b3453a">step_failed</text><path d="M 119 226 L 119 602 L 399 602 L 399 454" fill="none" stroke="#b3453a" stroke-width="1.8" marker-end="url(#arrow-b3453a)"/><rect x="205.5" y="585" width="107.0" height="18" rx="3" fill="#ffffff" opacity="0.94"/><text x="259" y="598" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#b3453a">cancel_requested</text><path d="M 240 197 L 330 197" fill="none" stroke="#41586e" stroke-width="1.8" marker-end="url(#arrow-41586e)"/><rect x="236.4" y="146" width="101.1" height="18" rx="3" fill="#ffffff" opacity="0.94"/><text x="287" y="159" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#41586e">pivot_committed</text><path d="M 520 197 L 890 197" fill="none" stroke="#2f6b4f" stroke-width="1.8" marker-end="url(#arrow-2f6b4f)"/><rect x="653.5" y="146" width="107.0" height="18" rx="3" fill="#ffffff" opacity="0.94"/><text x="707" y="159" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#2f6b4f">forward_complete</text><path d="M 520 197 L 567 197 L 567 309 L 610 309" fill="none" stroke="#41586e" stroke-width="1.8" marker-end="url(#arrow-41586e)"/><rect x="453.0" y="267.64" width="113.0" height="18" rx="3" fill="#ffffff" opacity="0.94"/><text x="560" y="280.64" text-anchor="end" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#41586e">forward_exhausted</text><path d="M 520 421 L 890 421" fill="none" stroke="#b3453a" stroke-width="1.8" marker-end="url(#arrow-b3453a)"/><rect x="635.7" y="370" width="142.7" height="18" rx="3" fill="#ffffff" opacity="0.94"/><text x="707" y="383" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#b3453a">compensations_complete</text><path d="M 520 421 L 567 421 L 567 533 L 610 533" fill="none" stroke="#b3453a" stroke-width="1.8" marker-end="url(#arrow-b3453a)"/><rect x="423.3" y="491.64" width="142.7" height="18" rx="3" fill="#ffffff" opacity="0.94"/><text x="560" y="504.64" text-anchor="end" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#b3453a">compensation_exhausted</text><path d="M 735 562 L 735 630 L 455 630 L 455 454" fill="none" stroke="#8a6212" stroke-width="1.8" marker-end="url(#arrow-8a6212)"/><rect x="541.5" y="613" width="107.0" height="18" rx="3" fill="#ffffff" opacity="0.94"/><text x="595" y="626" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#8a6212">operator_retried</text><path d="M 800 533 L 890 533" fill="none" stroke="#8a6212" stroke-width="1.8" marker-end="url(#arrow-8a6212)"/><rect x="796.5" y="482" width="101.1" height="18" rx="3" fill="#ffffff" opacity="0.94"/><text x="847" y="495" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#8a6212">operator_closed</text><path d="M 679 280 L 679 116 L 399 116 L 399 164" fill="none" stroke="#8a6212" stroke-width="1.8" marker-end="url(#arrow-8a6212)"/><rect x="485.5" y="99" width="107.0" height="18" rx="3" fill="#ffffff" opacity="0.94"/><text x="539" y="112" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#8a6212">operator_resumed</text><path d="M 800 309 L 847 309 L 847 533 L 890 533" fill="none" stroke="#8a6212" stroke-width="1.8" marker-end="url(#arrow-8a6212)"/><rect x="744.9" y="460.28" width="101.1" height="18" rx="3" fill="#ffffff" opacity="0.94"/><text x="840" y="473.28" text-anchor="end" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#8a6212">operator_closed</text><text x="54" y="668" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#4d708c">A transition added without a declared route makes the generator throw, so the picture cannot fall behind the table.</text></svg>
